name: Caching with npm
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7

    - name: Setup Node 24
      id: setup-node
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v6
      env:
        cache-name: cache-node-modules
      with:
        path: node_modules
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('**/package-lock.json') }}

    - name: Print Node.js version
      shell: bash
      run: node --version

    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      shell: bash
      run: HUSKY=0 npm ci
